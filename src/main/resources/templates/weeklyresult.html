<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Veckoanalys</title>
</head>

<body

        style="
background-color:#1e1e1e;
color:white;
font-family:Arial,serif;

    display:flex;
    flex-direction:column;
    align-items:center;
    ">

<h2 th:text="'Vecka ' + ${weeklyanalyses.weeklyNumber}">
</h2>

<table
        style="
    border-collapse:collapse;
    background:white;
    color:black;
    border-radius:10px;
    overflow:hidden;
    min-width:1100px;
    text-align:center;
    ">
    <tr>
        <th style="
    padding:14px;
    background:#f2f2f2;
    font-size:18px;">
        <th>Datum</th>
        <th>Ordinarie timmar</th>
        <th>Faktiska timmar</th>
        <th>Saknas</th>
        <th>Rek. FP</th>
        <th>Status</th>
    </tr>

    <tr th:each="day : ${weeklyanalyses.dailyAnalyses}"
        style="transition:0.2s;">

        <td style="padding:10px;"
            th:text="${day.date}">
        </td>

        <td style="padding:10px;"
            th:text="${day.dayOfWeek}">
        </td>

        <td style="padding:10px;"
            th:text="${day.baselineHours}">
        </td>

        <td style="padding:10px;"
            th:text="${day.actualHours}">
        </td>

        <td style="padding:10px;"
            th:text="${day.gapHours}">
        </td>

        <td style="padding:10px;"
            th:text="${day.recommendedExtent}">
        </td>

        <td
            th:text="${day.status}"
            style="
    padding:12px;
    font-weight:bold;
    width:160px;"


            th:styleappend="${day.status == 'AT_RISK'}
    ? 'background-color:#ffcccc; color:red;'
    : 'background-color:#ccffcc; color:green;'">
        </td>
    </tr>

</table>

<a
        href="/"
        style="
    color:white;
    text-decoration:none;
    margin-top:20px;">
    Tillbaka
</a>
</body>
</html>
