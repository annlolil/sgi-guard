<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Registrera</title>
</head>

<body style="
background:#1e1e1e;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial,serif;
">

<div style="
background:#dcdcdc;
padding:50px;
border-radius:20px;
width:400px;
">

  <h1 style="
        color:green;
        margin-bottom:24px;">

    Registrera användare
  </h1>

  <form th:action="@{/register}"
        th:object="${registerRequest}"
        method="post">

    <div style="margin-bottom:20px;">
      <label>Personnummer

      <input type="text"
             th:field="*{personalNumber}"
             style="width:100%;
             padding:12px;
             box-sizing:border-box;">
      </label>
    </div>

    <div style="margin-bottom:20px;">
      <label>Förnamn

      <input type="text"
             th:field="*{firstName}"
             style="width:100%;
             padding:12px;
             box-sizing:border-box;">
      </label>
    </div>

    <div style="margin-bottom:20px;">
      <label>Efternamn

      <input type="text"
             th:field="*{lastName}"
             style="width:100%;
             padding:12px;
             box-sizing:border-box;">
      </label>
    </div>

    <div style="margin-bottom:20px;">
      <label>Lösenord

      <input type="password"
             th:field="*{password}"
             style="width:100%;
             padding:12px;
             box-sizing:border-box;">
      </label>
    </div>

    <button type="submit"
            style="
                width:100%;
                padding:14px;
                background:green;
                color:white;
                border:none;
                border-radius:10px;
                font-size:18px;
                font-weight:bold;">

      Registrera

    </button>

    <div th:if="${registerError}"
         style="
     background:#ffcccc;
     color:#990000;
     padding:10px;
     border-radius:8px;
     margin-top:25px;
     margin-bottom:15px;
     font-weight:bold;">

      <span th:text="${registerError}"></span>

    </div>

  </form>

</div>

</body>
</html>
